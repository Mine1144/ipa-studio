# Codemagic — build .ipa สำหรับแอป Capacitor (ไม่ต้องใช้ GitHub Actions)
# หมายเหตุ: ขั้นตอน build จะ "ไม่ fail" เพื่อให้เก็บ log กลับมาได้ (ดู errors.txt)
#          ถ้า build สำเร็จจริง จะได้ .ipa ที่ artifacts

workflows:
  ios_ipa:
    name: Build IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.0"
    scripts:
      - name: Select Node
        script: |
          echo "export NVM_DIR=\"$HOME/.nvm\"" >> "$BASH_ENV"
          echo "source $NVM_DIR/nvm.sh" >> "$BASH_ENV"
          nvm install 22
          nvm use 22
          node --version

      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor (www -> ios)
        script: npx cap sync ios

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build app (Release / device)
        script: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$HOME/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$HOME/xcodebuild.log"
          echo "xcodebuild_exit=${PIPESTATUS[0]}" | tee -a "$HOME/xcodebuild.log"
          exit 0

      - name: Collect errors
        script: |
          {
            echo "=== xcodebuild exit ==="
            grep -E "xcodebuild_exit=" "$HOME/xcodebuild.log" | tail -1
            echo "=== error lines ==="
            grep -nE "error:|error generated|BUILD FAILED|The following build commands failed|Command .* failed" "$HOME/xcodebuild.log" | tail -60
            echo "=== tail ==="
            tail -40 "$HOME/xcodebuild.log"
          } > "$HOME/errors.txt" 2>&1 || true
          head -120 "$HOME/errors.txt"

      - name: Package IPA
        script: |
          APP_DIR="$HOME/dd/Build/Products/Release-iphoneos/App.app"
          rm -rf "$HOME/ipa"
          mkdir -p "$HOME/ipa/Payload"
          if [ -d "$APP_DIR" ]; then
            cp -R "$APP_DIR" "$HOME/ipa/Payload/ThaiLiveOverlay.app"
            cd "$HOME/ipa"
            zip -qry "$HOME/ThaiLiveOverlay-unsigned.ipa" Payload
            ls -lh "$HOME/ThaiLiveOverlay-unsigned.ipa"
          else
            echo "::warning::ไม่พบ App bundle — build ล้ม (ดู errors.txt)"
          fi

    artifacts:
      - "$HOME/errors.txt"
      - "$HOME/xcodebuild.log"
      - "$HOME/ThaiLiveOverlay-unsigned.ipa"

# Codemagic — build .ipa สำหรับแอป Capacitor (ไม่ต้องใช้ GitHub Actions)
#
# วิธีรับผลลัพธ์: build จะส่ง error/URL กลับมาที่ ntfy topic "ipa-build-log-7411"
#   อ่านด้วย: curl "https://ntfy.sh/ipa-build-log-7411/json?poll=1"

workflows:
  ios_ipa:
    name: Build IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.0"
    scripts:
      - name: Select Node
        script: |
          echo "export NVM_DIR=\"$HOME/.nvm\"" >> "$BASH_ENV"
          echo "source $NVM_DIR/nvm.sh" >> "$BASH_ENV"
          nvm install 22
          nvm use 22
          node --version

      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor (www -> ios)
        script: npx cap sync ios

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build app (Release / device)
        script: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$HOME/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$HOME/xcodebuild.log"
          echo "xcodebuild_exit=${PIPESTATUS[0]}" | tee -a "$HOME/xcodebuild.log"
          exit 0

      - name: Collect errors
        script: |
          {
            echo "=== xcodebuild exit ==="
            grep -E "xcodebuild_exit=" "$HOME/xcodebuild.log" | tail -1
            echo "=== error lines ==="
            grep -nE "error:|error generated|BUILD FAILED|The following build commands failed" "$HOME/xcodebuild.log" | tail -60
          } > "$HOME/errors.txt" 2>&1 || true
          cat "$HOME/errors.txt"

      - name: Report errors to ntfy
        script: |
          {
            echo "build: ThaiLiveOverlay"
            echo "repo: Mine1144/ipa-translator"
            grep -E "error:|error generated|BUILD FAILED" "$HOME/xcodebuild.log" | head -22
          } | head -c 3000 | curl -s --max-time 30 -H "Title: ThaiLiveOverlay build" --data-binary @- "https://ntfy.sh/ipa-build-log-7411" || true
          echo ""

      - name: Package IPA
        script: |
          APP_DIR="$HOME/dd/Build/Products/Release-iphoneos/App.app"
          rm -rf "$HOME/ipa"
          mkdir -p "$HOME/ipa/Payload"
          if [ -d "$APP_DIR" ]; then
            cp -R "$APP_DIR" "$HOME/ipa/Payload/ThaiLiveOverlay.app"
            cd "$HOME/ipa"
            zip -qry "$HOME/ThaiLiveOverlay-unsigned.ipa" Payload
            ls -lh "$HOME/ThaiLiveOverlay-unsigned.ipa"
          else
            echo "no app bundle"
          fi

      - name: Upload IPA and report URL
        script: |
          IPA="$HOME/ThaiLiveOverlay-unsigned.ipa"
          if [ ! -f "$IPA" ]; then
            echo "no ipa to upload"
            exit 0
          fi
          URL=""
          U=$(curl -s --max-time 180 -F "file=@$IPA" https://0x0.st || true)
          case "$U" in http*) URL="$U" ;; esac
          if [ -z "$URL" ]; then
            U=$(curl -s --max-time 180 -F "files[]=@$IPA" https://uguu.se/upload.php || true)
            URL=$(echo "$U" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('url',''))" 2>/dev/null || true)
          fi
          if [ -z "$URL" ]; then
            U=$(curl -s --max-time 180 -F "file=@$IPA" https://tmpfiles.org/api/v1/upload || true)
            URL=$(echo "$U" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('url',''))" 2>/dev/null || true)
          fi
          echo "IPA_URL=$URL"
          {
            echo "build: ThaiLiveOverlay"
            echo "ipa: $URL"
            echo "size: $(du -h "$IPA" | cut -f1)"
          } | curl -s --max-time 30 -H "Title: IPA ready" --data-binary @- "https://ntfy.sh/ipa-build-log-7411" || true
          echo ""

    artifacts:
      - "$HOME/errors.txt"
      - "$HOME/xcodebuild.log"
      - "$HOME/ThaiLiveOverlay-unsigned.ipa"
